<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Libre - Juan Pérez</title>
</head>
<body>

    <h1>Formulario Libre</h1>

    <form method="POST" action=“http://www.google.com”>

     <div style="background-color: #99ddff; padding: 20px; width: 400px; ">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Escribe tu apellido" required><br><br>

        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        
        <label for="psw">Contraseña:</label>
        <input type="password" id="psw" name="psw" required><br><br>

        
        <fieldset style="background-color: aquamarine;">
            <legend>Sexo</legend>
            <input type="radio" id="hombre" name="sexo" value="hombre">
            <label for="hombre">Hombre</label><br>
            <input type="radio" id="mujer" name="sexo" value="mujer" checked>
            <label for="mujer">Mujer</label>
        </fieldset><br>

       
        <fieldset style="background-color: aquamarine;">
            <legend>Aficiones</legend>
            <input type="checkbox" id="deporte" name="aficiones" value="deporte">
            <label for="deporte">Deporte</label><br>
            <input type="checkbox" id="musica" name="aficiones" value="musica" checked>
            <label for="musica">Música</label><br>
            <input type="checkbox" id="cine" name="aficiones" value="cine">
            <label for="cine">Cine</label>
        </fieldset><br>

      
        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="elegir" selected>elegir</option>
            <option value="españa" >España</option>
            <option value="francia">Francia</option>
            <option value="italia">Italia</option>
        </select><br><br>

        
        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" cols="30" rows="4" placeholder="Escribe tus comentarios"></textarea><br><br>

     
        <label for="equipo">Equipo favorito:</label>
        <input list="equipos" id="equipo" name="equipo">
        <datalist id="equipos">
            <option value="Barça">
            <option value="VARdrid">
            <option value="Valencia">
        </datalist><br><br>

        
        <button type="submit">Enviar</button>

    </form>
</div>
</body>
</html>
