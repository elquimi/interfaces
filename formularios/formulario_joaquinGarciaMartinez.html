<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>

<div style="background-color: lightgray; border-style:solid;  width: 550px; height:500px;" >


    <h2 style="color: white; text-align: center;">Formulario total</h2>
    <form action="tablas_JoaquinGarciaMartinez.html" method="get" style="margin-right: 10px; margin-top: 50px; text-align: right;"> 

        <label for="nombre" style="margin: 10px;">Nombre:</label>
        <input type="text" id="nombre" name="nombre" style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);" required><br><br>

        <label for="apellido" style="margin: 10px;">Apellido:</label>
        <input type="text" id="apellido" name="apellido" style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);" required><br><br>

        <label for="email" style="margin: 10px;">E-mail:</label>
        <input type="email" id="email" name="email" required style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);"><br><br>

        <label for="dni" style="margin: 10px;">DNI:</label>
        <input type="number" id="dni" name="dni" required style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);"><br><br>

        <label for="psw" style="margin: 10px;">Contraseña: </label>
        <input type="password" id="psw" name="psw" required style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);"><br><br>

        <label for="rep_psw" style="margin: 10px;">Repetir contraseña: </label>
        <input type="password" id="rep_psw" name="rep_psw" required style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);"><br><br>

        <label for="ip" style="margin: 10px;">ip_equipo</label>
        <input type="text" id="ip" name="ip" style="width: 350px; box-shadow: inset 5px 5px 15px rgba(0,0,0,0.5);"><br><br>


        <div style="text-align: center; " > 
        <input type="submit" value="Enviar" style="background-color: blue; width: 100px; height: 40px; color: white;" >
        </div>
    </form>
</div>


    
</body>
</html>
